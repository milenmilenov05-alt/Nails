<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#db2777">
    <title>График Нокти | Записване на часове</title>
    <style>
        :root {
            --primary: #db2777;
            --primary-light: #fce7f3;
            --bg: #fdf2f8;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --tarnovo-bg: #ede9fe;
            --tarnovo-text: #6d28d9;
            --selo-bg: #d1fae5;
            --selo-text: #047857;
            --danger: #ef4444;
            --success: #10b981;
            --border: #f3e8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 90px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #db2777, #9d174d);
            color: white;
            padding: 16px 16px 12px;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.2);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-top h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .backup-btns button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 4px;
            cursor: pointer;
        }

        /* Location Filter Tabs */
        .location-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: rgba(0, 0, 0, 0.15);
            padding: 4px;
            border-radius: 12px;
        }

        .loc-tab {
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 4px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .loc-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        /* Controls Bar */
        .controls {
            background: white;
            padding: 12px 16px;
            border-bottom: 1px solid #f3f4f6;
            position: sticky;
            top: 96px;
            z-index: 15;
        }

        .view-mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 7px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .mode-btn.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .date-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-nav button {
            background: #f3f4f6;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
        }

        .date-nav input[type="date"] {
            flex: 1;
            height: 38px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0 12px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            background: #f9fafb;
            text-align: center;
        }

        .today-btn {
            width: auto !important;
            padding: 0 12px !important;
            font-size: 13px !important;
            background: var(--primary-light) !important;
            color: var(--primary) !important;
        }

        .search-box {
            margin-top: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            font-size: 14px;
            background: #f9fafb;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Appointment List */
        .container {
            padding: 0 16px;
        }

        .date-group-header {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin: 14px 0 8px 4px;
            text-transform: capitalize;
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border-left: 5px solid var(--primary);
            transition: opacity 0.2s;
        }

        .card.loc-tarnovo {
            border-left-color: #7c3aed;
        }

        .card.loc-selo {
            border-left-color: #10b981;
        }

        .card.completed {
            opacity: 0.6;
            background: #f9fafb;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .time-badge {
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
            background: #f3f4f6;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .loc-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .loc-badge.tarnovo {
            background: var(--tarnovo-bg);
            color: var(--tarnovo-text);
        }

        .loc-badge.selo {
            background: var(--selo-bg);
            color: var(--selo-text);
        }

        .client-info {
            margin-bottom: 8px;
        }

        .client-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .procedure-tag {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-light);
            padding: 3px 8px;
            border-radius: 6px;
            margin-top: 4px;
        }

        .price-tag {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            color: #047857;
            background: #d1fae5;
            padding: 3px 8px;
            border-radius: 6px;
            margin-top: 4px;
            margin-left: 4px;
        }

        .notes {
            font-size: 13px;
            color: var(--text-muted);
            background: #f9fafb;
            padding: 8px;
            border-radius: 8px;
            margin-top: 6px;
            border-left: 3px solid #d1d5db;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #f3f4f6;
        }

        .action-btn {
            border: none;
            background: #f3f4f6;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn.call {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .action-btn.done {
            background: #ecfdf5;
            color: #047857;
        }

        .action-btn.delete {
            background: #fef2f2;
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state p {
            font-size: 15px;
            margin-top: 8px;
        }

        /* Floating Add Button */
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #db2777, #be185d);
            color: white;
            border: none;
            height: 56px;
            padding: 0 22px;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(219, 39, 119, 0.4);
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 22px 22px 0 0;
            padding: 20px 18px 28px;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            font-size: 19px;
            font-weight: 700;
        }

        .close-btn {
            background: #f3f4f6;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px; /* Prevents auto-zoom on iOS */
            background: #fff;
            color: var(--text);
        }

        .location-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .loc-option {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            background: #f9fafb;
        }

        .loc-option.selected-tarnovo {
            border-color: #7c3aed;
            background: var(--tarnovo-bg);
            color: var(--tarnovo-text);
        }

        .loc-option.selected-selo {
            border-color: #10b981;
            background: var(--selo-bg);
            color: var(--selo-text);
        }

        .save-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <h1>💅 График Нокти</h1>
        <div class="backup-btns">
            <button onclick="exportData()" title="Изтегли резервно копие">⬇ Бекъп</button>
            <button onclick="document.getElementById('importFile').click()" title="Възстанови от файл">⬆ Възстанови</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        </div>
    </div>
    <div class="location-tabs">
        <button class="loc-tab active" onclick="setLocationFilter('all')" id="tab-all">Всички</button>
        <button class="loc-tab" onclick="setLocationFilter('tarnovo')" id="tab-tarnovo">📍 Търново</button>
        <button class="loc-tab" onclick="setLocationFilter('selo')" id="tab-selo">🏡 На село</button>
    </div>
</header>

<div class="controls">
    <div class="view-mode-switch">
        <button class="mode-btn active" id="mode-date" onclick="setViewMode('date')">📅 По дата</button>
        <button class="mode-btn" id="mode-upcoming" onclick="setViewMode('upcoming')">📋 Всички предстоящи</button>
    </div>

    <div class="date-nav" id="dateNavContainer">
        <button onclick="changeDate(-1)">❮</button>
        <input type="date" id="selectedDate" onchange="renderAppointments()">
        <button onclick="changeDate(1)">❯</button>
        <button class="today-btn" onclick="goToToday()">Днес</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Търси по име или телефон..." oninput="renderAppointments()">
    </div>
</div>

<div class="stats-bar">
    <span id="countStat">Записани: 0</span>
    <span id="priceStat">Общо: 0 лв.</span>
</div>

<div class="container" id="appointmentsList"></div>

<button class="fab" onclick="openModal()">
    <span>＋</span> Нов час
</button>

<!-- Modal за добавяне и редакция -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOutsideClick(event)">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Запиши нов час</h2>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <form id="appointmentForm" onsubmit="saveAppointment(event)">
            <input type="hidden" id="editId">

            <div class="form-group">
                <label>Къде е часът?</label>
                <div class="location-selector">
                    <div class="loc-option selected-tarnovo" id="opt-tarnovo" onclick="selectFormLocation('tarnovo')">
                        📍 Търново
                    </div>
                    <div class="loc-option" id="opt-selo" onclick="selectFormLocation('selo')">
                        🏡 На село
                    </div>
                </div>
                <input type="hidden" id="formLocation" value="tarnovo">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" id="formDate" required>
                </div>
                <div class="form-group">
                    <label>Час</label>
                    <input type="time" id="formTime" required>
                </div>
            </div>

            <div class="form-group">
                <label>Име на клиент</label>
                <input type="text" id="formName" placeholder="Напр. Мария Иванова" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Телефон (по желание)</label>
                    <input type="tel" id="formPhone" placeholder="0888...">
                </div>
                <div class="form-group">
                    <label>Цена (лв.)</label>
                    <input type="number" id="formPrice" placeholder="Напр. 50" step="1">
                </div>
            </div>

            <div class="form-group">
                <label>Процедура</label>
                <select id="formProcedure">
                    <option value="Маникюр с гел лак">💅 Маникюр с гел лак</option>
                    <option value="Поддръжка гел">✨ Поддръжка гел</option>
                    <option value="Изграждане">🌸 Изграждане</option>
                    <option value="Укрепване с база/гел">💎 Укрепване с база/гел</option>
                    <option value="Педикюр">🦶 Педикюр</option>
                    <option value="Маникюр + Педикюр">👑 Маникюр + Педикюр</option>
                    <option value="Сваляне / Поправка">🔧 Сваляне / Поправка на нокът</option>
                    <option value="Друго">📝 Друго</option>
                </select>
            </div>

            <div class="form-group">
                <label>Бележки (дизайн, цветове, особености)</label>
                <textarea id="formNotes" rows="2" placeholder="Напр. Френски с камъчета, 2 счупени нокътя..."></textarea>
            </div>

            <button type="submit" class="save-btn">Запази часа</button>
        </form>
    </div>
</div>

<script>
    const STORAGE_KEY = 'nail_appointments_data_v1';
    let appointments = loadAppointments();
    let currentLocationFilter = 'all'; // 'all', 'tarnovo', 'selo'
    let currentViewMode = 'date'; // 'date' or 'upcoming'

    function isValidAppointment(item) {
        if (!item || typeof item !== 'object' || Array.isArray(item)) return false;
        if (typeof item.id !== 'string' || !item.id) return false;
        if (!['tarnovo', 'selo'].includes(item.location)) return false;
        if (typeof item.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(item.date)) return false;
        const parsedDate = new Date(`${item.date}T00:00:00Z`);
        if (!Number.isFinite(parsedDate.getTime()) || parsedDate.toISOString().slice(0, 10) !== item.date) return false;
        if (typeof item.time !== 'string' || !/^\d{2}:\d{2}$/.test(item.time)) return false;
        const [hours, minutes] = item.time.split(':').map(Number);
        if (hours > 23 || minutes > 59) return false;
        return typeof item.name === 'string'
            && typeof item.phone === 'string'
            && typeof item.price === 'string'
            && (item.price === '' || Number.isFinite(Number(item.price)))
            && typeof item.procedure === 'string'
            && typeof item.notes === 'string'
            && typeof item.completed === 'boolean';
    }

    function loadAppointments() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return [];

        let parsed;
        try {
            parsed = JSON.parse(saved);
        } catch (error) {
            alert('Запазените часове са повредени. Възстанови ги от резервно копие.');
            return [];
        }

        if (!Array.isArray(parsed) || !parsed.every(isValidAppointment)) {
            alert('Запазените часове са невалидни. Възстанови ги от резервно копие.');
            return [];
        }
        return parsed;
    }

    // Задаване на днешна дата при старт
    function getTodayString() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    document.getElementById('selectedDate').value = getTodayString();

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));
    }

    function setLocationFilter(loc) {
        currentLocationFilter = loc;
        document.querySelectorAll('.loc-tab').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${loc}`).classList.add('active');
        renderAppointments();
    }

    function setViewMode(mode) {
        currentViewMode = mode;
        document.getElementById('mode-date').classList.toggle('active', mode === 'date');
        document.getElementById('mode-upcoming').classList.toggle('active', mode === 'upcoming');
        document.getElementById('dateNavContainer').style.display = mode === 'date' ? 'flex' : 'none';
        renderAppointments();
    }

    function changeDate(days) {
        const input = document.getElementById('selectedDate');
        const current = new Date(input.value || getTodayString());
        current.setDate(current.getDate() + days);
        input.value = current.toISOString().split('T')[0];
        renderAppointments();
    }

    function goToToday() {
        document.getElementById('selectedDate').value = getTodayString();
        renderAppointments();
    }

    function formatBgDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        return date.toLocaleDateString('bg-BG', {
            weekday: 'long',
            day: 'numeric',
            month: 'long'
        });
    }

    function renderAppointments() {
        const listEl = document.getElementById('appointmentsList');
        const selectedDate = document.getElementById('selectedDate').value;
        const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
        const todayStr = getTodayString();

        // Филтриране
        let filtered = appointments.filter(app => {
            if (currentLocationFilter !== 'all' && app.location !== currentLocationFilter) {
                return false;
            }
            if (searchQuery) {
                const matchName = app.name.toLowerCase().includes(searchQuery);
                const matchPhone = (app.phone || '').toLowerCase().includes(searchQuery);
                const matchNotes = (app.notes || '').toLowerCase().includes(searchQuery);
                return matchName || matchPhone || matchNotes;
            }
            if (currentViewMode === 'date') {
                return app.date === selectedDate;
            } else {
                return app.date >= todayStr;
            }
        });

        // Сортиране по дата и час
        filtered.sort((a, b) => {
            if (a.date !== b.date) return a.date.localeCompare(b.date);
            return a.time.localeCompare(b.time);
        });

        // Статистика
        const totalPrice = filtered.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
        document.getElementById('countStat').textContent = `Записани часове: ${filtered.length}`;
        document.getElementById('priceStat').textContent = `Сума: ${totalPrice} лв.`;

        if (filtered.length === 0) {
            listEl.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 42px;">💅</div>
                    <p>Няма записани часове за този избор.</p>
                </div>
            `;
            return;
        }

        let html = '';
        let lastDate = '';

        filtered.forEach(app => {
            if (currentViewMode === 'upcoming' || searchQuery) {
                if (app.date !== lastDate) {
                    html += `<div class="date-group-header">📅 ${formatBgDate(app.date)}</div>`;
                    lastDate = app.date;
                }
            }

            const locLabel = app.location === 'tarnovo' ? '📍 Търново' : '🏡 На село';
            const locClass = app.location === 'tarnovo' ? 'tarnovo' : 'selo';

            html += `
                <div class="card loc-${locClass} ${app.completed ? 'completed' : ''}">
                    <div class="card-header">
                        <span class="time-badge">🕒 ${escapeHtml(app.time)}</span>
                        <span class="loc-badge ${locClass}">${locLabel}</span>
                    </div>
                    <div class="client-info">
                        <div class="client-name">${escapeHtml(app.name)}</div>
                        <span class="procedure-tag">${escapeHtml(app.procedure)}</span>
                        ${app.price ? `<span class="price-tag">${escapeHtml(app.price)} лв.</span>` : ''}
                        ${app.notes ? `<div class="notes">${escapeHtml(app.notes)}</div>` : ''}
                    </div>
                    <div class="card-actions">
                        <div>
                            ${app.phone ? `<a href="tel:${escapeHtml(app.phone)}" class="action-btn call">📞 Обади се</a>` : ''}
                            <button class="action-btn done" data-action="toggle" data-id="${escapeHtml(app.id)}">
                                ${app.completed ? '↩ Върни' : '✔ Готово'}
                            </button>
                        </div>
                        <div>
                            <button class="action-btn" data-action="edit" data-id="${escapeHtml(app.id)}">✏️</button>
                            <button class="action-btn delete" data-action="delete" data-id="${escapeHtml(app.id)}">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        });

        listEl.innerHTML = html;
    }

    // Модал за добавяне/редакция
    function selectFormLocation(loc) {
        document.getElementById('formLocation').value = loc;
        const optTarnovo = document.getElementById('opt-tarnovo');
        const optSelo = document.getElementById('opt-selo');

        optTarnovo.className = 'loc-option ' + (loc === 'tarnovo' ? 'selected-tarnovo' : '');
        optSelo.className = 'loc-option ' + (loc === 'selo' ? 'selected-selo' : '');
    }

    function openModal(editItem = null) {
        const modal = document.getElementById('modalOverlay');
        document.getElementById('appointmentForm').reset();

        if (editItem) {
            document.getElementById('modalTitle').textContent = 'Редактирай час';
            document.getElementById('editId').value = editItem.id;
            selectFormLocation(editItem.location);
            document.getElementById('formDate').value = editItem.date;
            document.getElementById('formTime').value = editItem.time;
            document.getElementById('formName').value = editItem.name;
            document.getElementById('formPhone').value = editItem.phone || '';
            document.getElementById('formPrice').value = editItem.price || '';
            document.getElementById('formProcedure').value = editItem.procedure;
            document.getElementById('formNotes').value = editItem.notes || '';
        } else {
            document.getElementById('modalTitle').textContent = 'Запиши нов час';
            document.getElementById('editId').value = '';
            const defaultLoc = currentLocationFilter === 'selo' ? 'selo' : 'tarnovo';
            selectFormLocation(defaultLoc);
            document.getElementById('formDate').value = document.getElementById('selectedDate').value || getTodayString();
            document.getElementById('formTime').value = '10:00';
        }

        modal.classList.add('open');
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('open');
    }

    function closeModalOnOutsideClick(e) {
        if (e.target.id === 'modalOverlay') closeModal();
    }

    function saveAppointment(e) {
        e.preventDefault();
        const editId = document.getElementById('editId').value;

        const itemData = {
            id: editId || Date.now().toString(),
            location: document.getElementById('formLocation').value,
            date: document.getElementById('formDate').value,
            time: document.getElementById('formTime').value,
            name: document.getElementById('formName').value.trim(),
            phone: document.getElementById('formPhone').value.trim(),
            price: document.getElementById('formPrice').value,
            procedure: document.getElementById('formProcedure').value,
            notes: document.getElementById('formNotes').value.trim(),
            completed: false
        };

        if (editId) {
            const idx = appointments.findIndex(a => a.id === editId);
            if (idx !== -1) {
                itemData.completed = appointments[idx].completed;
                appointments[idx] = itemData;
            }
        } else {
            appointments.push(itemData);
        }

        saveToStorage();
        document.getElementById('selectedDate').value = itemData.date;
        closeModal();
        renderAppointments();
    }

    function editAppointment(id) {
        const item = appointments.find(a => a.id === id);
        if (item) openModal(item);
    }

    function toggleCompleted(id) {
        const item = appointments.find(a => a.id === id);
        if (item) {
            item.completed = !item.completed;
            saveToStorage();
            renderAppointments();
        }
    }

    function deleteAppointment(id) {
        if (confirm('Сигурна ли си, че искаш да изтриеш този час?')) {
            appointments = appointments.filter(a => a.id !== id);
            saveToStorage();
            renderAppointments();
        }
    }

    // Бекъп и възстановяване
    function exportData() {
        const dataStr = JSON.stringify(appointments, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `grafik-nokti-${getTodayString()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            let imported;
            try {
                imported = JSON.parse(e.target.result);
            } catch (err) {
                alert('Невалиден файл!');
                return;
            }

            if (!Array.isArray(imported) || !imported.every(isValidAppointment)) {
                alert('Невалиден файл!');
                return;
            }

            appointments = imported;
            saveToStorage();
            renderAppointments();
            alert('Часовете са възстановени успешно!');
        };
        reader.readAsText(file);
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // Първоначално зареждане
    document.getElementById('appointmentsList').addEventListener('click', function(event) {
        const button = event.target.closest('button[data-action]');
        if (!button) return;

        const { action, id } = button.dataset;
        if (action === 'toggle') toggleCompleted(id);
        if (action === 'edit') editAppointment(id);
        if (action === 'delete') deleteAppointment(id);
    });
    renderAppointments();
</script>

</body>
</html>
