<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Нокти">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#c2185b">
    <meta name="description" content="График за маникюр - записване на часове офлайн">

    <link rel="manifest" href="manifest.json">

    <!-- Apple touch icons (generated inline as SVG data URIs) -->
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>💅 График Нокти</title>

    <style>
        :root {
            --primary:        #c2185b;
            --primary-dark:   #880e4f;
            --primary-light:  #fce4ec;
            --primary-mid:    #f48fb1;
            --accent:         #e91e63;
            --bg:             #fff5f9;
            --card-bg:        #ffffff;
            --surface:        #fce4ec;
            --text:           #212121;
            --text-muted:     #757575;
            --text-on-primary:#ffffff;
            --tarnovo-bg:     #ede7f6;
            --tarnovo-text:   #4527a0;
            --tarnovo-accent: #7c4dff;
            --selo-bg:        #e8f5e9;
            --selo-text:      #1b5e20;
            --selo-accent:    #00c853;
            --danger:         #f44336;
            --success:        #4caf50;
            --warning:        #ff9800;
            --border:         #f8bbd0;
            --shadow-sm:      0 1px 4px rgba(194,24,91,0.08);
            --shadow-md:      0 4px 16px rgba(194,24,91,0.12);
            --shadow-lg:      0 8px 32px rgba(194,24,91,0.18);
            --radius-sm:      10px;
            --radius-md:      16px;
            --radius-lg:      22px;
            --radius-xl:      28px;
            --transition:     0.2s cubic-bezier(0.4,0,0.2,1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            padding-bottom: 100px;
            min-height: 100vh;
            overscroll-behavior-y: none;
        }

        /* ═══════════════════════════════ HEADER ═══════════════════════════════ */
        header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 14px 16px 0;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(194,24,91,0.3);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .pwa-badge {
            background: rgba(255,255,255,0.2);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255,255,255,0.18);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition);
        }

        .icon-btn:active { background: rgba(255,255,255,0.35); }

        /* Location Tabs */
        .location-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            background: rgba(0,0,0,0.2);
            padding: 4px;
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            margin-top: 4px;
        }

        .loc-tab {
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.8);
            padding: 9px 4px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.1px;
        }

        .loc-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* ═══════════════════════════════ CONTROLS ═══════════════════════════ */
        .controls {
            background: white;
            padding: 12px 16px;
            border-bottom: 1px solid #f3f4f6;
            position: sticky;
            top: 108px;
            z-index: 15;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .view-mode-switch {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            background: #f3f4f6;
            padding: 4px;
            border-radius: var(--radius-sm);
        }

        .mode-btn {
            flex: 1;
            padding: 7px;
            border-radius: 8px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
        }

        .mode-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .date-nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-arrow {
            background: #f3f4f6;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            font-size: 18px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background var(--transition);
        }

        .nav-arrow:active { background: var(--primary-light); }

        .date-input-wrap {
            flex: 1;
            position: relative;
        }

        .date-input-wrap input[type="date"] {
            width: 100%;
            height: 40px;
            border: 1.5px solid #e5e7eb;
            border-radius: var(--radius-sm);
            padding: 0 12px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            background: #f9fafb;
            text-align: center;
            cursor: pointer;
        }

        .today-pill {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            padding: 0 14px;
            height: 40px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background var(--transition);
        }

        .today-pill:active { background: var(--primary-mid); color: white; }

        .search-wrap {
            margin-top: 10px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            pointer-events: none;
        }

        .search-wrap input {
            width: 100%;
            padding: 9px 12px 9px 36px;
            border-radius: var(--radius-sm);
            border: 1.5px solid #e5e7eb;
            font-size: 14px;
            background: #f9fafb;
            transition: border-color var(--transition);
        }

        .search-wrap input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        /* ═══════════════════════════════ STATS ═══════════════════════════════ */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px 8px;
            gap: 8px;
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .stat-chip .stat-icon { font-size: 14px; }

        /* ═══════════════════════════════ CARDS ════════════════════════════════ */
        .container {
            padding: 4px 14px 0;
        }

        .date-section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
            margin: 14px 2px 8px;
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }

        .date-section-header::after {
            content: '';
            flex: 1;
            height: 1.5px;
            background: linear-gradient(90deg, var(--border), transparent);
            border-radius: 2px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #f3e8ff22;
            position: relative;
            overflow: hidden;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--primary);
            border-radius: 4px 0 0 4px;
        }

        .card.loc-tarnovo::before { background: var(--tarnovo-accent); }
        .card.loc-selo::before    { background: var(--selo-accent); }

        .card.completed {
            opacity: 0.55;
            background: #f9fafb;
        }

        .card:active { transform: scale(0.99); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .time-badge {
            font-size: 18px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .loc-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.2px;
        }

        .loc-badge.tarnovo {
            background: var(--tarnovo-bg);
            color: var(--tarnovo-text);
        }

        .loc-badge.selo {
            background: var(--selo-bg);
            color: var(--selo-text);
        }

        .client-name {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text);
        }

        .tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 4px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 7px;
        }

        .tag.procedure {
            color: var(--primary);
            background: var(--primary-light);
        }

        .tag.price {
            color: var(--selo-text);
            background: var(--selo-bg);
        }

        .card-notes {
            font-size: 13px;
            color: var(--text-muted);
            background: #f8fafc;
            padding: 7px 10px;
            border-radius: 8px;
            margin-top: 8px;
            border-left: 3px solid #e2e8f0;
            line-height: 1.4;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #f3f4f6;
        }

        .actions-left, .actions-right {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            border: none;
            padding: 7px 12px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all var(--transition);
        }

        .action-btn.call {
            background: #e8f0fe;
            color: #1a73e8;
        }

        .action-btn.done {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .action-btn.undone {
            background: #fff3e0;
            color: #e65100;
        }

        .action-btn.edit {
            background: #f3f4f6;
            color: var(--text-muted);
        }

        .action-btn.delete {
            background: #fdecea;
            color: var(--danger);
        }

        .action-btn:active { opacity: 0.7; transform: scale(0.97); }

        /* ═══════════════════════════════ EMPTY STATE ══════════════════════════ */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-emoji {
            font-size: 52px;
            margin-bottom: 10px;
            display: block;
        }

        .empty-state p { font-size: 15px; margin-top: 6px; }

        /* ═══════════════════════════════ FAB ══════════════════════════════════ */
        .fab {
            position: fixed;
            bottom: 22px;
            right: 18px;
            background: linear-gradient(135deg, var(--accent), var(--primary-dark));
            color: white;
            border: none;
            height: 58px;
            padding: 0 24px;
            border-radius: 29px;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 6px 24px rgba(194,24,91,0.42);
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .fab:active {
            transform: scale(0.96);
            box-shadow: 0 3px 12px rgba(194,24,91,0.35);
        }

        .fab-plus {
            font-size: 22px;
            font-weight: 300;
            line-height: 1;
        }

        /* ═══════════════════════════════ MODAL ════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 50;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: white;
            width: 100%;
            max-width: 520px;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            padding: 8px 18px 32px;
            max-height: 93vh;
            overflow-y: auto;
            animation: slideUp 0.25s cubic-bezier(0.4,0,0.2,1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .modal-handle {
            width: 38px;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin: 10px auto 14px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 800;
        }

        .close-btn {
            background: #f3f4f6;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: background var(--transition);
        }

        .close-btn:active { background: var(--primary-light); }

        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        input[type="time"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: var(--radius-sm);
            font-size: 16px;
            background: #fafafa;
            color: var(--text);
            transition: border-color var(--transition), background var(--transition);
            appearance: auto;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(194,24,91,0.08);
        }

        textarea { resize: none; line-height: 1.5; }

        /* Location selector in form */
        .location-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .loc-option {
            padding: 13px;
            border: 2px solid #e5e7eb;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            background: #f9fafb;
            transition: all var(--transition);
        }

        .loc-option.selected-tarnovo {
            border-color: var(--tarnovo-accent);
            background: var(--tarnovo-bg);
            color: var(--tarnovo-text);
        }

        .loc-option.selected-selo {
            border-color: var(--selo-accent);
            background: var(--selo-bg);
            color: var(--selo-text);
        }

        .save-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--primary-dark));
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 800;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(194,24,91,0.3);
            letter-spacing: 0.3px;
            transition: opacity var(--transition), transform var(--transition);
        }

        .save-btn:active { opacity: 0.85; transform: scale(0.99); }

        /* ═══════════════════════════════ INSTALL BANNER ═══════════════════════ */
        .install-banner {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            position: relative;
        }

        .install-banner .install-emoji { font-size: 22px; }

        .install-banner .install-text { flex: 1; }

        .install-banner .install-text strong { display: block; font-size: 14px; margin-bottom: 1px; }

        .install-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .close-banner {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
        }

        /* ═══════════════════════════════ TOAST ════════════════════════════════ */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1f2937;
            color: white;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ═══════════════════════════════ OFFLINE BADGE ════════════════════════ */
        .offline-banner {
            background: #ef6c00;
            color: white;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            padding: 6px;
            display: none;
        }

        body.offline .offline-banner { display: block; }

        /* ═══════════════════════════════ RESPONSIVE ═══════════════════════════ */
        @media (max-width: 360px) {
            .header-title h1 { font-size: 17px; }
            .action-btn { font-size: 12px; padding: 6px 9px; }
        }

        @media (prefers-color-scheme: dark) {
            /* Keep light theme for this app - it's a nail salon app */
        }

        /* ═══════════════════════════════ EARNINGS TAB ═════════════════════════ */
        .earnings-panel { display: none; padding: 14px 14px 0; }
        .earnings-panel.active { display: block; }

        .year-nav {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 14px;
        }
        .year-nav button {
            background: #f3f4f6; border: none;
            width: 36px; height: 36px; border-radius: 10px;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background var(--transition);
        }
        .year-nav button:active { background: var(--primary-light); }
        .year-label { font-size: 18px; font-weight: 900; color: var(--text); min-width: 60px; text-align: center; }

        .month-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
        .month-card {
            background: white; border-radius: var(--radius-md);
            padding: 12px 8px; text-align: center;
            box-shadow: var(--shadow-sm); border: 2px solid transparent;
            cursor: pointer; transition: all var(--transition); position: relative;
        }
        .month-card.selected { border-color: var(--primary); background: var(--primary-light); }
        .month-card.current-month::after {
            content: '●'; position: absolute; top: 4px; right: 6px;
            font-size: 8px; color: var(--primary);
        }
        .month-card-name { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: capitalize; margin-bottom: 4px; }
        .month-card-amount { font-size: 15px; font-weight: 900; color: var(--text); }
        .month-card-amount.has-income { color: var(--primary); }
        .month-card-count { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        .range-section { background: white; border-radius: var(--radius-md); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
        .range-section h3 { font-size: 14px; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
        .range-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .range-inputs label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
        .range-inputs input[type="date"] { width: 100%; padding: 9px 10px; border: 1.5px solid #e5e7eb; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; background: #f9fafb; }

        .range-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .preset-btn { background: #f3f4f6; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: all var(--transition); }
        .preset-btn.active-preset { background: var(--primary-light); color: var(--primary); }

        .earnings-summary {
            background: linear-gradient(135deg, var(--accent), var(--primary-dark));
            border-radius: var(--radius-md); padding: 18px; color: white;
            margin-bottom: 14px; box-shadow: var(--shadow-lg);
        }
        .earnings-summary .summary-label { font-size: 12px; font-weight: 700; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .earnings-summary .summary-total { font-size: 36px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
        .earnings-summary .summary-meta { display: flex; gap: 16px; font-size: 13px; opacity: 0.85; flex-wrap: wrap; }

        .location-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .split-card { background: white; border-radius: var(--radius-md); padding: 14px; box-shadow: var(--shadow-sm); text-align: center; }
        .split-card .split-icon { font-size: 22px; margin-bottom: 4px; }
        .split-card .split-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .split-card .split-amount { font-size: 20px; font-weight: 900; }
        .split-card.tarnovo .split-amount { color: var(--tarnovo-text); }
        .split-card.selo    .split-amount { color: var(--selo-text); }
        .split-card .split-count { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .breakdown-section { background: white; border-radius: var(--radius-md); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
        .breakdown-section h3 { font-size: 14px; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
        .breakdown-row { padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
        .breakdown-row:last-child { border-bottom: none; }
        .breakdown-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .breakdown-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
        .breakdown-count { font-size: 12px; color: var(--text-muted); margin: 0 8px; }
        .breakdown-amount { font-size: 14px; font-weight: 800; color: var(--primary); }
        .breakdown-bar-wrap { width: 100%; background: #f3f4f6; border-radius: 4px; height: 4px; }
        .breakdown-bar { height: 4px; background: linear-gradient(90deg, var(--accent), var(--primary-dark)); border-radius: 4px; transition: width 0.4s ease; }

        .no-earnings { text-align: center; padding: 30px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

<!-- Offline notification -->
<div class="offline-banner">📵 Офлайн режим — данните се запазват локално</div>

<!-- Install banner (shows when installable) -->
<div class="install-banner" id="installBanner" style="display:none">
    <span class="install-emoji">📲</span>
    <div class="install-text">
        <strong>Инсталирай приложението</strong>
        Добави на началния екран за бърз достъп
    </div>
    <button class="install-btn" id="installBtn">Инсталирай</button>
    <button class="close-banner" id="dismissBanner">✕</button>
</div>

<header>
    <div class="header-top">
        <div class="header-title">
            <h1>💅 График Нокти</h1>
            <span class="pwa-badge" id="pwaBadge" style="display:none">offline</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="exportData()" title="Изтегли бекъп">⬇️</button>
            <button class="icon-btn" onclick="document.getElementById('importFile').click()" title="Възстанови от файл">⬆️</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        </div>
    </div>
    <div class="location-tabs">
        <button class="loc-tab active" onclick="setLocationFilter('all')"   id="tab-all">Всички</button>
        <button class="loc-tab"        onclick="setLocationFilter('tarnovo')" id="tab-tarnovo">📍 Търново</button>
        <button class="loc-tab"        onclick="setLocationFilter('selo')"    id="tab-selo">🏡 На село</button>
    </div>
</header>

<div class="controls">
    <div class="view-mode-switch">
        <button class="mode-btn active" id="mode-date"     onclick="setViewMode('date')">📅 По дата</button>
        <button class="mode-btn"        id="mode-upcoming" onclick="setViewMode('upcoming')">📋 Предстоящи</button>
        <button class="mode-btn"        id="mode-earnings" onclick="setViewMode('earnings')">💰 Приходи</button>
    </div>

    <div class="date-nav" id="dateNavContainer">
        <button class="nav-arrow" onclick="changeDate(-1)">&#8249;</button>
        <div class="date-input-wrap">
            <input type="date" id="selectedDate" onchange="renderAppointments()">
        </div>
        <button class="nav-arrow" onclick="changeDate(1)">&#8250;</button>
        <button class="today-pill" onclick="goToToday()">Днес</button>
    </div>

    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Търси по име, телефон или бележка..." oninput="renderAppointments()">
    </div>
</div>

<div class="stats-bar">
    <div class="stat-chip">
        <span class="stat-icon">📋</span>
        <span id="countStat">0 часа</span>
    </div>
    <div class="stat-chip">
        <span class="stat-icon">💰</span>
        <span id="priceStat">0 €</span>
    </div>
</div>

<div class="container" id="appointmentsList"></div>

<!-- Earnings Panel -->
<div class="earnings-panel" id="earningsPanel">

    <!-- Year navigation -->
    <div class="year-nav">
        <button onclick="changeEarningsYear(-1)">&#8249;</button>
        <span class="year-label" id="earningsYearLabel">2025</span>
        <button onclick="changeEarningsYear(1)">&#8250;</button>
    </div>

    <!-- Month grid -->
    <div class="month-grid" id="monthGrid"></div>

    <!-- Range picker -->
    <div class="range-section">
        <h3>📆 Произволен период</h3>
        <div class="range-presets">
            <button class="preset-btn" onclick="setPreset('week')">Тази седмица</button>
            <button class="preset-btn" onclick="setPreset('month')">Този месец</button>
            <button class="preset-btn" onclick="setPreset('quarter')">3 месеца</button>
            <button class="preset-btn" onclick="setPreset('year')">Тази година</button>
            <button class="preset-btn" onclick="setPreset('all')">Всичко</button>
        </div>
        <div class="range-inputs">
            <div>
                <label>От дата</label>
                <input type="date" id="rangeFrom" onchange="renderEarnings()">
            </div>
            <div>
                <label>До дата</label>
                <input type="date" id="rangeTo" onchange="renderEarnings()">
            </div>
        </div>
    </div>

    <!-- Summary + breakdown rendered here -->
    <div id="earningsResult"></div>
</div>

<button class="fab" onclick="openModal()">
    <span class="fab-plus">+</span>
    <span>Нов час</span>
</button>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOutsideClick(event)">
    <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <h2 id="modalTitle">Запиши нов час</h2>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <form id="appointmentForm" onsubmit="saveAppointment(event)">
            <input type="hidden" id="editId">

            <div class="form-group">
                <label>Локация</label>
                <div class="location-selector">
                    <div class="loc-option selected-tarnovo" id="opt-tarnovo" onclick="selectFormLocation('tarnovo')">
                        📍 Търново
                    </div>
                    <div class="loc-option" id="opt-selo" onclick="selectFormLocation('selo')">
                        🏡 На село
                    </div>
                </div>
                <input type="hidden" id="formLocation" value="tarnovo">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" id="formDate" required>
                </div>
                <div class="form-group">
                    <label>Час</label>
                    <input type="time" id="formTime" required>
                </div>
            </div>

            <div class="form-group">
                <label>Име на клиент</label>
                <input type="text" id="formName" placeholder="Напр. Мария Иванова" required autocomplete="off">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="formPhone" placeholder="0888..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Цена (€)</label>
                    <input type="number" id="formPrice" placeholder="50" step="1" min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Процедура</label>
                <select id="formProcedure">
                    <option value="Маникюр с гел лак">💅 Маникюр с гел лак</option>
                    <option value="Поддръжка гел">✨ Поддръжка гел</option>
                    <option value="Изграждане">🌸 Изграждане</option>
                    <option value="Укрепване с база/гел">💎 Укрепване с база/гел</option>
                    <option value="Педикюр">🦶 Педикюр</option>
                    <option value="Маникюр + Педикюр">👑 Маникюр + Педикюр</option>
                    <option value="Сваляне / Поправка">🔧 Сваляне / Поправка</option>
                    <option value="Друго">📝 Друго</option>
                </select>
            </div>

            <div class="form-group">
                <label>Бележки</label>
                <textarea id="formNotes" rows="2" placeholder="Дизайн, цветове, особености..."></textarea>
            </div>

            <button type="submit" class="save-btn">Запази часа</button>
        </form>
    </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>
    // ═══════════════════════════════════════════════════════════════
    // PWA — Register Service Worker
    // ═══════════════════════════════════════════════════════════════
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                document.getElementById('pwaBadge').style.display = 'inline';
                console.log('SW registered');
            }).catch(err => console.log('SW error:', err));
        });
    }

    // ═══════════════════════════════════════════════════════════════
    // PWA — Install prompt
    // ═══════════════════════════════════════════════════════════════
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const banner = document.getElementById('installBanner');
        const dismissed = localStorage.getItem('installBannerDismissed');
        if (!dismissed) banner.style.display = 'flex';
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('installBanner').style.display = 'none';
        if (result.outcome === 'accepted') showToast('✅ Приложението е инсталирано!');
    });

    document.getElementById('dismissBanner').addEventListener('click', () => {
        document.getElementById('installBanner').style.display = 'none';
        localStorage.setItem('installBannerDismissed', '1');
    });

    // ═══════════════════════════════════════════════════════════════
    // Offline detection
    // ═══════════════════════════════════════════════════════════════
    function updateOnlineStatus() {
        document.body.classList.toggle('offline', !navigator.onLine);
    }
    window.addEventListener('online',  updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // ═══════════════════════════════════════════════════════════════
    // Toast
    // ═══════════════════════════════════════════════════════════════
    let toastTimer = null;
    function showToast(msg, duration = 2500) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    // ═══════════════════════════════════════════════════════════════
    // Data layer — localStorage with validation
    // ═══════════════════════════════════════════════════════════════
    const STORAGE_KEY = 'nail_appointments_data_v1';
    let appointments = loadAppointments();
    let currentLocationFilter = 'all';
    let currentViewMode = 'date';

    function isValidAppointment(item) {
        if (!item || typeof item !== 'object' || Array.isArray(item)) return false;
        if (typeof item.id !== 'string' || !item.id) return false;
        if (!['tarnovo', 'selo'].includes(item.location)) return false;
        if (typeof item.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(item.date)) return false;
        const parsedDate = new Date(`${item.date}T00:00:00Z`);
        if (!Number.isFinite(parsedDate.getTime()) || parsedDate.toISOString().slice(0, 10) !== item.date) return false;
        if (typeof item.time !== 'string' || !/^\d{2}:\d{2}$/.test(item.time)) return false;
        const [hours, minutes] = item.time.split(':').map(Number);
        if (hours > 23 || minutes > 59) return false;
        return typeof item.name === 'string'
            && typeof item.phone === 'string'
            && typeof item.price === 'string'
            && (item.price === '' || Number.isFinite(Number(item.price)))
            && typeof item.procedure === 'string'
            && typeof item.notes === 'string'
            && typeof item.completed === 'boolean';
    }

    function loadAppointments() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return [];
            const parsed = JSON.parse(saved);
            if (!Array.isArray(parsed) || !parsed.every(isValidAppointment)) {
                showToast('⚠️ Данните са невалидни. Зареждам празно.');
                return [];
            }
            return parsed;
        } catch (e) {
            showToast('⚠️ Грешка при четене на данните.');
            return [];
        }
    }

    function saveToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));
        } catch (e) {
            showToast('❌ Паметта е пълна! Изтрий стари записи.');
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // Date helpers
    // ═══════════════════════════════════════════════════════════════
    function getTodayString() {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function formatBgDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        return date.toLocaleDateString('bg-BG', {
            weekday: 'long',
            day: 'numeric',
            month: 'long'
        });
    }

    document.getElementById('selectedDate').value = getTodayString();

    // ═══════════════════════════════════════════════════════════════
    // View / filter controls
    // ═══════════════════════════════════════════════════════════════
    function setLocationFilter(loc) {
        currentLocationFilter = loc;
        document.querySelectorAll('.loc-tab').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${loc}`).classList.add('active');
        renderAppointments();
    }

    function setViewMode(mode) {
        currentViewMode = mode;
        document.getElementById('mode-date').classList.toggle('active', mode === 'date');
        document.getElementById('mode-upcoming').classList.toggle('active', mode === 'upcoming');
        document.getElementById('mode-earnings').classList.toggle('active', mode === 'earnings');

        const isEarnings = mode === 'earnings';
        document.getElementById('dateNavContainer').style.display = (mode === 'date') ? 'flex' : 'none';
        document.getElementById('appointmentsList').style.display = isEarnings ? 'none' : '';
        document.getElementById('earningsPanel').classList.toggle('active', isEarnings);
        // hide stats bar when in earnings mode
        document.querySelector('.stats-bar').style.display = isEarnings ? 'none' : '';

        if (isEarnings) {
            renderMonthGrid();
            renderEarnings();
        } else {
            renderAppointments();
        }
    }

    function changeDate(days) {
        const input = document.getElementById('selectedDate');
        const current = new Date((input.value || getTodayString()) + 'T00:00:00');
        current.setDate(current.getDate() + days);
        const yyyy = current.getFullYear();
        const mm = String(current.getMonth() + 1).padStart(2, '0');
        const dd = String(current.getDate()).padStart(2, '0');
        input.value = `${yyyy}-${mm}-${dd}`;
        renderAppointments();
    }

    function goToToday() {
        document.getElementById('selectedDate').value = getTodayString();
        setViewMode('date');
        renderAppointments();
    }

    // ═══════════════════════════════════════════════════════════════
    // Render
    // ═══════════════════════════════════════════════════════════════
    function renderAppointments() {
        const listEl = document.getElementById('appointmentsList');
        const selectedDate = document.getElementById('selectedDate').value;
        const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
        const todayStr = getTodayString();

        let filtered = appointments.filter(app => {
            if (currentLocationFilter !== 'all' && app.location !== currentLocationFilter) return false;
            if (searchQuery) {
                return app.name.toLowerCase().includes(searchQuery)
                    || (app.phone || '').toLowerCase().includes(searchQuery)
                    || (app.notes || '').toLowerCase().includes(searchQuery);
            }
            if (currentViewMode === 'date')     return app.date === selectedDate;
            if (currentViewMode === 'upcoming') return app.date >= todayStr;
            return true;
        });

        filtered.sort((a, b) => {
            if (a.date !== b.date) return a.date.localeCompare(b.date);
            return a.time.localeCompare(b.time);
        });

        // Stats
        const totalPrice = filtered.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
        document.getElementById('countStat').textContent = `${filtered.length} часа`;
        document.getElementById('priceStat').textContent = `${totalPrice} €`;

        if (filtered.length === 0) {
            listEl.innerHTML = `
                <div class="empty-state">
                    <span class="empty-emoji">💅</span>
                    <p>Няма записани часове.</p>
                    <p style="margin-top:4px;font-size:13px">Натисни <strong>+ Нов час</strong> за да добавиш.</p>
                </div>`;
            return;
        }

        let html = '';
        let lastDate = '';

        filtered.forEach(app => {
            if (currentViewMode === 'upcoming' || searchQuery) {
                if (app.date !== lastDate) {
                    const isToday = app.date === todayStr;
                    html += `<div class="date-section-header">${isToday ? '📌 Днес — ' : '📅 '}${formatBgDate(app.date)}</div>`;
                    lastDate = app.date;
                }
            }

            const locLabel = app.location === 'tarnovo' ? '📍 Търново' : '🏡 На село';
            const locClass = app.location === 'tarnovo' ? 'tarnovo' : 'selo';
            const priceTag = app.price ? `<span class="tag price">💰 ${escapeHtml(app.price)} €</span>` : '';
            const notesHtml = app.notes ? `<div class="card-notes">📝 ${escapeHtml(app.notes)}</div>` : '';
            const callBtn = app.phone
                ? `<a href="tel:${escapeHtml(app.phone)}" class="action-btn call">📞 Обади се</a>`
                : '';
            const doneBtn = app.completed
                ? `<button class="action-btn undone" data-action="toggle" data-id="${escapeHtml(app.id)}">↩ Върни</button>`
                : `<button class="action-btn done"   data-action="toggle" data-id="${escapeHtml(app.id)}">✔ Готово</button>`;

            html += `
                <div class="card loc-${locClass} ${app.completed ? 'completed' : ''}">
                    <div class="card-header">
                        <span class="time-badge">🕒 ${escapeHtml(app.time)}</span>
                        <span class="loc-badge ${locClass}">${locLabel}</span>
                    </div>
                    <div class="client-name">${escapeHtml(app.name)}</div>
                    <div class="tags-row">
                        <span class="tag procedure">💅 ${escapeHtml(app.procedure)}</span>
                        ${priceTag}
                    </div>
                    ${notesHtml}
                    <div class="card-actions">
                        <div class="actions-left">
                            ${callBtn}
                            ${doneBtn}
                        </div>
                        <div class="actions-right">
                            <button class="action-btn edit"   data-action="edit"   data-id="${escapeHtml(app.id)}">✏️</button>
                            <button class="action-btn delete" data-action="delete" data-id="${escapeHtml(app.id)}">🗑️</button>
                        </div>
                    </div>
                </div>`;
        });

        listEl.innerHTML = html;
    }

    // ═══════════════════════════════════════════════════════════════
    // Modal
    // ═══════════════════════════════════════════════════════════════
    function selectFormLocation(loc) {
        document.getElementById('formLocation').value = loc;
        document.getElementById('opt-tarnovo').className = 'loc-option ' + (loc === 'tarnovo' ? 'selected-tarnovo' : '');
        document.getElementById('opt-selo').className    = 'loc-option ' + (loc === 'selo' ? 'selected-selo' : '');
    }

    function openModal(editItem = null) {
        document.getElementById('appointmentForm').reset();

        if (editItem) {
            document.getElementById('modalTitle').textContent = 'Редактирай час';
            document.getElementById('editId').value = editItem.id;
            selectFormLocation(editItem.location);
            document.getElementById('formDate').value      = editItem.date;
            document.getElementById('formTime').value      = editItem.time;
            document.getElementById('formName').value      = editItem.name;
            document.getElementById('formPhone').value     = editItem.phone || '';
            document.getElementById('formPrice').value     = editItem.price || '';
            document.getElementById('formProcedure').value = editItem.procedure;
            document.getElementById('formNotes').value     = editItem.notes || '';
        } else {
            document.getElementById('modalTitle').textContent = 'Запиши нов час';
            document.getElementById('editId').value = '';
            const defaultLoc = currentLocationFilter === 'selo' ? 'selo' : 'tarnovo';
            selectFormLocation(defaultLoc);
            document.getElementById('formDate').value  = document.getElementById('selectedDate').value || getTodayString();
            document.getElementById('formTime').value  = '10:00';
        }

        document.getElementById('modalOverlay').classList.add('open');
        setTimeout(() => document.getElementById('formName').focus(), 300);
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('open');
    }

    function closeModalOnOutsideClick(e) {
        if (e.target.id === 'modalOverlay') closeModal();
    }

    function saveAppointment(e) {
        e.preventDefault();
        const editId = document.getElementById('editId').value;

        const itemData = {
            id:        editId || `${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
            location:  document.getElementById('formLocation').value,
            date:      document.getElementById('formDate').value,
            time:      document.getElementById('formTime').value,
            name:      document.getElementById('formName').value.trim(),
            phone:     document.getElementById('formPhone').value.trim(),
            price:     document.getElementById('formPrice').value,
            procedure: document.getElementById('formProcedure').value,
            notes:     document.getElementById('formNotes').value.trim(),
            completed: false
        };

        if (editId) {
            const idx = appointments.findIndex(a => a.id === editId);
            if (idx !== -1) {
                itemData.completed = appointments[idx].completed;
                appointments[idx] = itemData;
            }
        } else {
            appointments.push(itemData);
        }

        saveToStorage();
        document.getElementById('selectedDate').value = itemData.date;
        closeModal();
        renderAppointments();
        showToast(editId ? '✏️ Часът е обновен!' : '✅ Часът е записан!');
    }

    function editAppointment(id) {
        const item = appointments.find(a => a.id === id);
        if (item) openModal(item);
    }

    function toggleCompleted(id) {
        const item = appointments.find(a => a.id === id);
        if (item) {
            item.completed = !item.completed;
            saveToStorage();
            renderAppointments();
            showToast(item.completed ? '✔ Готово!' : '↩ Върнато');
        }
    }

    function deleteAppointment(id) {
        const item = appointments.find(a => a.id === id);
        if (!item) return;
        if (confirm(`Изтрий часа на ${item.name}?`)) {
            appointments = appointments.filter(a => a.id !== id);
            saveToStorage();
            renderAppointments();
            showToast('🗑️ Часът е изтрит');
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // Backup / Restore
    // ═══════════════════════════════════════════════════════════════
    function exportData() {
        const dataStr = JSON.stringify(appointments, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `grafik-nokti-backup-${getTodayString()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('⬇️ Бекъпът е изтеглен!');
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            let imported;
            try { imported = JSON.parse(e.target.result); }
            catch (err) { showToast('❌ Невалиден файл!'); return; }

            if (!Array.isArray(imported) || !imported.every(isValidAppointment)) {
                showToast('❌ Файлът съдържа невалидни данни!');
                return;
            }
            appointments = imported;
            saveToStorage();
            renderAppointments();
            showToast(`✅ Заредени ${imported.length} записа!`);
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ═══════════════════════════════════════════════════════════════
    // Security — HTML escape
    // ═══════════════════════════════════════════════════════════════
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ═══════════════════════════════════════════════════════════════
    // Event delegation for card actions
    // ═══════════════════════════════════════════════════════════════
    document.getElementById('appointmentsList').addEventListener('click', function(event) {
        const button = event.target.closest('[data-action]');
        if (!button) return;
        const { action, id } = button.dataset;
        if (action === 'toggle') toggleCompleted(id);
        if (action === 'edit')   editAppointment(id);
        if (action === 'delete') deleteAppointment(id);
    });

    // Swipe to close modal
    let touchStartY = 0;
    document.querySelector('.modal').addEventListener('touchstart', e => {
        touchStartY = e.touches[0].clientY;
    }, { passive: true });
    document.querySelector('.modal').addEventListener('touchmove', e => {
        const diff = e.touches[0].clientY - touchStartY;
        if (diff > 80) closeModal();
    }, { passive: true });

    // ═══════════════════════════════════════════════════════════════
    // Initial render
    // ═══════════════════════════════════════════════════════════════
    renderAppointments();

    // ═══════════════════════════════════════════════════════════════
    // EARNINGS — state
    // ═══════════════════════════════════════════════════════════════
    let earningsYear = new Date().getFullYear();
    let selectedEarningsMonth = null; // null = use range; number 0-11 = month index

    const BG_MONTHS = [
        'Януари','Февруари','Март','Април','Май','Юни',
        'Юли','Август','Септември','Октомври','Ноември','Декември'
    ];

    function getDateString(d) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // ═══════════════════════════════════════════════════════════════
    // EARNINGS — year navigation
    // ═══════════════════════════════════════════════════════════════
    function changeEarningsYear(delta) {
        earningsYear += delta;
        document.getElementById('earningsYearLabel').textContent = earningsYear;
        selectedEarningsMonth = null;
        renderMonthGrid();
        // clear range when changing year
        document.getElementById('rangeFrom').value = '';
        document.getElementById('rangeTo').value = '';
        document.getElementById('earningsResult').innerHTML = '';
        // remove active preset
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active-preset'));
    }

    // ═══════════════════════════════════════════════════════════════
    // EARNINGS — month grid
    // ═══════════════════════════════════════════════════════════════
    function renderMonthGrid() {
        document.getElementById('earningsYearLabel').textContent = earningsYear;
        const today = new Date();
        const thisYear  = today.getFullYear();
        const thisMonth = today.getMonth();
        let html = '';

        for (let m = 0; m < 12; m++) {
            const monthStart = `${earningsYear}-${String(m+1).padStart(2,'0')}-01`;
            const monthEnd   = `${earningsYear}-${String(m+1).padStart(2,'0')}-${new Date(earningsYear, m+1, 0).getDate()}`;
            const inMonth = appointments.filter(a =>
                a.date >= monthStart && a.date <= monthEnd && a.price
            );
            const total = inMonth.reduce((s, a) => s + (Number(a.price) || 0), 0);
            const count = inMonth.length;

            const isCurrent = earningsYear === thisYear && m === thisMonth;
            const isSelected = selectedEarningsMonth === m;

            html += `
                <div class="month-card ${isSelected ? 'selected' : ''} ${isCurrent ? 'current-month' : ''}"
                     onclick="selectMonth(${m})">
                    <div class="month-card-name">${BG_MONTHS[m]}</div>
                    <div class="month-card-amount ${total > 0 ? 'has-income' : ''}">${total > 0 ? total + ' €' : '—'}</div>
                    <div class="month-card-count">${count > 0 ? count + ' часа' : ''}</div>
                </div>`;
        }
        document.getElementById('monthGrid').innerHTML = html;
    }

    function selectMonth(monthIndex) {
        selectedEarningsMonth = monthIndex;
        renderMonthGrid();

        // Set range to that month
        const year = earningsYear;
        const m = monthIndex;
        const firstDay = getDateString(new Date(year, m, 1));
        const lastDay  = getDateString(new Date(year, m+1, 0));
        document.getElementById('rangeFrom').value = firstDay;
        document.getElementById('rangeTo').value   = lastDay;

        // clear preset highlights
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active-preset'));
        renderEarnings();
    }

    // ═══════════════════════════════════════════════════════════════
    // EARNINGS — range presets
    // ═══════════════════════════════════════════════════════════════
    function setPreset(key) {
        selectedEarningsMonth = null;
        renderMonthGrid();
        const today = new Date();
        let from, to;

        if (key === 'week') {
            const day = today.getDay() === 0 ? 6 : today.getDay() - 1; // Monday start
            from = new Date(today); from.setDate(today.getDate() - day);
            to   = new Date(today);
        } else if (key === 'month') {
            from = new Date(today.getFullYear(), today.getMonth(), 1);
            to   = new Date(today.getFullYear(), today.getMonth()+1, 0);
            earningsYear = today.getFullYear();
        } else if (key === 'quarter') {
            from = new Date(today); from.setMonth(today.getMonth() - 2); from.setDate(1);
            to   = new Date(today.getFullYear(), today.getMonth()+1, 0);
        } else if (key === 'year') {
            from = new Date(today.getFullYear(), 0, 1);
            to   = new Date(today.getFullYear(), 11, 31);
            earningsYear = today.getFullYear();
        } else if (key === 'all') {
            const dates = appointments.map(a => a.date).sort();
            if (dates.length === 0) { renderEarnings(); return; }
            from = new Date(dates[0] + 'T00:00:00');
            to   = new Date(dates[dates.length-1] + 'T00:00:00');
        }

        document.getElementById('rangeFrom').value = getDateString(from);
        document.getElementById('rangeTo').value   = getDateString(to);

        // highlight active preset
        document.querySelectorAll('.preset-btn').forEach(b => {
            b.classList.toggle('active-preset', b.textContent.trim() === {
                week: 'Тази седмица', month: 'Този месец',
                quarter: '3 месеца', year: 'Тази година', all: 'Всичко'
            }[key]);
        });
        renderEarnings();
    }

    // ═══════════════════════════════════════════════════════════════
    // EARNINGS — main render
    // ═══════════════════════════════════════════════════════════════
    function renderEarnings() {
        const fromVal = document.getElementById('rangeFrom').value;
        const toVal   = document.getElementById('rangeTo').value;
        const el = document.getElementById('earningsResult');

        if (!fromVal || !toVal) {
            el.innerHTML = `<div class="no-earnings">👆 Избери месец или период горе</div>`;
            return;
        }

        if (fromVal > toVal) {
            el.innerHTML = `<div class="no-earnings">⚠️ „От дата" трябва да е преди „До дата"</div>`;
            return;
        }

        const filtered = appointments.filter(a => a.price && a.date >= fromVal && a.date <= toVal);

        // From-to label
        const fromDate = new Date(fromVal + 'T00:00:00');
        const toDate   = new Date(toVal   + 'T00:00:00');
        const periodLabel = fromVal === toVal
            ? fromDate.toLocaleDateString('bg-BG', { day: 'numeric', month: 'long', year: 'numeric' })
            : `${fromDate.toLocaleDateString('bg-BG', { day: 'numeric', month: 'short' })} — ${toDate.toLocaleDateString('bg-BG', { day: 'numeric', month: 'short', year: 'numeric' })}`;

        const total  = filtered.reduce((s, a) => s + (Number(a.price) || 0), 0);
        const avgPer = filtered.length > 0 ? (total / filtered.length).toFixed(1) : 0;

        if (filtered.length === 0) {
            el.innerHTML = `
                <div class="earnings-summary">
                    <div class="summary-label">${periodLabel}</div>
                    <div class="summary-total">0 €</div>
                    <div class="summary-meta"><span>📋 Няма часове с цена</span></div>
                </div>`;
            return;
        }

        // Location split
        const tarFilter = filtered.filter(a => a.location === 'tarnovo');
        const seloFilter = filtered.filter(a => a.location === 'selo');
        const tarTotal  = tarFilter.reduce((s, a) => s + (Number(a.price) || 0), 0);
        const seloTotal = seloFilter.reduce((s, a) => s + (Number(a.price) || 0), 0);

        // Procedure breakdown
        const procMap = {};
        filtered.forEach(a => {
            if (!procMap[a.procedure]) procMap[a.procedure] = { count: 0, total: 0 };
            procMap[a.procedure].count++;
            procMap[a.procedure].total += Number(a.price) || 0;
        });
        const procList = Object.entries(procMap).sort((a, b) => b[1].total - a[1].total);
        const maxProc  = procList[0]?.[1].total || 1;

        const breakdownHtml = procList.map(([name, data]) => `
            <div class="breakdown-row">
                <div class="breakdown-top">
                    <span class="breakdown-name">${escapeHtml(name)}</span>
                    <span class="breakdown-count">${data.count}×</span>
                    <span class="breakdown-amount">${data.total} €</span>
                </div>
                <div class="breakdown-bar-wrap">
                    <div class="breakdown-bar" style="width:${Math.round(data.total/maxProc*100)}%"></div>
                </div>
            </div>`).join('');

        el.innerHTML = `
            <div class="earnings-summary">
                <div class="summary-label">${periodLabel}</div>
                <div class="summary-total">${total} €</div>
                <div class="summary-meta">
                    <span>📋 ${filtered.length} часа</span>
                    <span>📊 Средно ${avgPer} €/час</span>
                </div>
            </div>

            <div class="location-split">
                <div class="split-card tarnovo">
                    <div class="split-icon">📍</div>
                    <div class="split-label">Търново</div>
                    <div class="split-amount">${tarTotal} €</div>
                    <div class="split-count">${tarFilter.length} часа</div>
                </div>
                <div class="split-card selo">
                    <div class="split-icon">🏡</div>
                    <div class="split-label">На село</div>
                    <div class="split-amount">${seloTotal} €</div>
                    <div class="split-count">${seloFilter.length} часа</div>
                </div>
            </div>

            <div class="breakdown-section">
                <h3>💅 По процедура</h3>
                ${breakdownHtml}
            </div>`;
    }
</script>
</body>
</html>
